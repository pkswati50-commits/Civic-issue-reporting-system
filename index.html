<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CivicFix — Report an Issue</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  #map { height: 380px; border-radius: 12px; }
  .status-reported { background:#fee2e2; color:#991b1b; }
  .status-acknowledged { background:#fef3c7; color:#92400e; }
  .status-in_progress { background:#dbeafe; color:#1e40af; }
  .status-resolved { background:#dcfce7; color:#166534; }
</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

<header class="bg-emerald-700 text-white px-6 py-4 flex items-center justify-between shadow">
  <div>
    <h1 class="text-xl font-bold">🏙️ CivicFix</h1>
    <p class="text-emerald-100 text-sm">Report → Verify → Prioritize → Assign → Work → Resolve → Verify → Learn</p>
  </div>
  <a href="/admin" class="bg-white text-emerald-700 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-emerald-50">Authority Dashboard →</a>
</header>

<main class="max-w-5xl mx-auto p-6 grid md:grid-cols-2 gap-6">

  <!-- Report Form -->
  <section class="bg-white rounded-xl shadow p-6">
    <h2 class="text-lg font-bold mb-4">📍 Report a Civic Issue</h2>
    <form id="reportForm" class="space-y-4">
      <div>
        <label class="text-sm font-semibold">Category</label>
        <select id="category" class="w-full border rounded-lg p-2 mt-1" required>
          <option value="pothole">Pothole</option>
          <option value="damaged_road">Damaged Road</option>
          <option value="garbage">Overflowing Garbage</option>
          <option value="illegal_dumping">Illegal Dumping</option>
          <option value="streetlight">Broken Streetlight</option>
          <option value="water_leakage">Water Leakage</option>
          <option value="drainage_blockage">Drainage Blockage</option>
          <option value="open_manhole">Open Manhole</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div>
        <label class="text-sm font-semibold">Description</label>
        <textarea id="description" class="w-full border rounded-lg p-2 mt-1" rows="3" placeholder="Describe the issue..." required></textarea>
      </div>
      <div>
        <label class="text-sm font-semibold">Photo evidence</label>
        <input type="file" id="photo" accept="image/*" class="w-full border rounded-lg p-2 mt-1" />
        <img id="photoPreview" class="mt-2 rounded-lg max-h-32 hidden" />
        <p id="aiSuggestion" class="text-xs mt-2 hidden"></p>
      </div>
      <div>
        <label class="text-sm font-semibold">Location</label>
        <button type="button" id="getLocationBtn" class="w-full border-2 border-dashed border-emerald-400 rounded-lg p-2 mt-1 text-emerald-700 font-semibold hover:bg-emerald-50">
          📍 Use My Current Location
        </button>
        <p id="locationStatus" class="text-xs text-slate-500 mt-1"></p>
      </div>
      <button type="submit" class="w-full bg-emerald-700 text-white font-bold py-3 rounded-lg hover:bg-emerald-800">
        Submit Report
      </button>
      <p id="submitResult" class="text-sm mt-2"></p>
    </form>
  </section>

  <!-- Map + My Reports -->
  <section class="space-y-6">
    <div class="bg-white rounded-xl shadow p-4">
      <h2 class="text-lg font-bold mb-3">🗺️ Live Issue Map</h2>
      <div id="map"></div>
    </div>

    <div class="bg-white rounded-xl shadow p-4">
      <h2 class="text-lg font-bold mb-3">📋 My Reports</h2>
      <div id="myReports" class="space-y-2 text-sm text-slate-500">No reports yet.</div>
    </div>
  </section>

</main>

<script>
const REPORTER_ID = localStorage.getItem('civicfix_reporter_id') ||
  (() => { const id = 'citizen_' + Math.random().toString(36).slice(2,9); localStorage.setItem('civicfix_reporter_id', id); return id; })();

let selectedLat = null, selectedLng = null;
let photoBase64 = null;

// Map setup (default center: Bengaluru — adjust as needed for your city)
const map = L.map('map').setView([12.9716, 77.5946], 12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);
let markers = [];

document.getElementById('getLocationBtn').onclick = () => {
  const statusEl = document.getElementById('locationStatus');
  statusEl.textContent = 'Getting location...';
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      selectedLat = pos.coords.latitude;
      selectedLng = pos.coords.longitude;
      statusEl.textContent = `✅ Location captured: ${selectedLat.toFixed(5)}, ${selectedLng.toFixed(5)}`;
      map.setView([selectedLat, selectedLng], 16);
    },
    (err) => { statusEl.textContent = '❌ Could not get location: ' + err.message; },
    { enableHighAccuracy: true }
  );
};

document.getElementById('photo').onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    photoBase64 = reader.result;
    const preview = document.getElementById('photoPreview');
    preview.src = photoBase64;
    preview.classList.remove('hidden');

    const suggestionEl = document.getElementById('aiSuggestion');
    suggestionEl.textContent = '🤖 Analyzing photo...';
    suggestionEl.className = 'text-xs mt-2 text-slate-400';
    suggestionEl.classList.remove('hidden');

    try {
      const res = await fetch('/api/analyze-photo', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ photo_base64: photoBase64 })
      });
      const data = await res.json();
      if (data.ai_available) {
        document.getElementById('category').value = data.category;
        const severityStars = '⚠️'.repeat(Math.min(data.severity || 1, 5));
        suggestionEl.innerHTML = `🤖 AI detected: <b>${data.category.replace('_',' ')}</b> ${severityStars}<br><span class="text-slate-500">${data.description || ''}</span>`;
        suggestionEl.className = 'text-xs mt-2 text-emerald-700';
      } else {
        suggestionEl.textContent = 'ℹ️ ' + (data.message || 'AI unavailable — pick category manually.');
        suggestionEl.className = 'text-xs mt-2 text-slate-400';
      }
    } catch (err) {
      suggestionEl.textContent = 'ℹ️ AI check skipped — pick category manually.';
      suggestionEl.className = 'text-xs mt-2 text-slate-400';
    }
  };
  reader.readAsDataURL(file);
};

document.getElementById('reportForm').onsubmit = async (e) => {
  e.preventDefault();
  const resultEl = document.getElementById('submitResult');
  if (selectedLat === null) {
    resultEl.textContent = '⚠️ Please capture your location first.';
    resultEl.className = 'text-sm mt-2 text-red-600';
    return;
  }
  const payload = {
    category: document.getElementById('category').value,
    description: document.getElementById('description').value,
    lat: selectedLat,
    lng: selectedLng,
    photo_base64: photoBase64,
    reporter_id: REPORTER_ID
  };
  resultEl.textContent = 'Submitting...';
  resultEl.className = 'text-sm mt-2 text-slate-500';
  try {
    const res = await fetch('/api/report', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (data.merged_into_existing) {
      resultEl.textContent = `🔁 ${data.message} (Now ${data.issue.upvotes} people confirmed this issue.)`;
      resultEl.className = 'text-sm mt-2 text-amber-700 font-semibold';
    } else {
      resultEl.textContent = `✅ ${data.message} Assigned to ${data.issue.department}.`;
      resultEl.className = 'text-sm mt-2 text-emerald-700 font-semibold';
    }
    document.getElementById('reportForm').reset();
    document.getElementById('photoPreview').classList.add('hidden');
    photoBase64 = null; selectedLat = null; selectedLng = null;
    document.getElementById('locationStatus').textContent = '';
    loadIssues();
  } catch (err) {
    resultEl.textContent = '❌ Failed to submit: ' + err.message;
    resultEl.className = 'text-sm mt-2 text-red-600';
  }
};

function statusLabel(s) {
  return { reported: 'Reported', acknowledged: 'Acknowledged', in_progress: 'In Progress', resolved: 'Resolved' }[s] || s;
}

async function loadIssues() {
  const res = await fetch('/api/issues');
  const issues = await res.json();

  // update map
  markers.forEach(m => map.removeLayer(m));
  markers = [];
  issues.forEach(issue => {
    const color = { reported: '#dc2626', acknowledged: '#d97706', in_progress: '#2563eb', resolved: '#16a34a' }[issue.status] || '#6b7280';
    const marker = L.circleMarker([issue.lat, issue.lng], {
      radius: 7 + Math.min(issue.upvotes, 10),
      color, fillColor: color, fillOpacity: 0.7
    }).addTo(map);
    marker.bindPopup(`<b>${issue.category.replace('_',' ')}</b><br>${issue.description}<br>Status: ${statusLabel(issue.status)}<br>👍 ${issue.upvotes} confirmations`);
    markers.push(marker);
  });

  // update "my reports"
  const myIssues = issues.filter(i => i.reporter_id === REPORTER_ID);
  const container = document.getElementById('myReports');
  if (myIssues.length === 0) {
    container.innerHTML = '<p class="text-slate-400">No reports yet.</p>';
    return;
  }
  container.innerHTML = myIssues.map(i => `
    <div class="border rounded-lg p-3 flex justify-between items-center">
      <div>
        <p class="font-semibold text-sm">${i.category.replace('_',' ')}</p>
        <p class="text-xs text-slate-500">${i.description}</p>
        <span class="text-xs px-2 py-0.5 rounded-full status-${i.status} inline-block mt-1">${statusLabel(i.status)}</span>
      </div>
      ${i.status === 'resolved' ? `
        <div class="flex gap-1">
          <button onclick="confirmFixed('${i.id}')" class="bg-emerald-600 text-white text-xs px-2 py-1 rounded">Confirm Fixed</button>
          <button onclick="reopenIssue('${i.id}')" class="bg-red-600 text-white text-xs px-2 py-1 rounded">Reopen</button>
        </div>` : ''}
    </div>
  `).join('');
}

async function confirmFixed(id) {
  await fetch(`/api/issues/${id}/confirm-fixed`, { method: 'POST' });
  alert('Thanks for verifying! Issue closed.');
  loadIssues();
}
async function reopenIssue(id) {
  await fetch(`/api/issues/${id}/reopen`, { method: 'POST' });
  alert('Issue reopened — authorities notified.');
  loadIssues();
}

loadIssues();
setInterval(loadIssues, 8000);
</script>
</body>
</html>
