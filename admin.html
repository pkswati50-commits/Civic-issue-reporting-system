<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CivicFix — Authority Dashboard</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  #map { height: 320px; border-radius: 12px; }
  .status-reported { background:#fee2e2; color:#991b1b; }
  .status-acknowledged { background:#fef3c7; color:#92400e; }
  .status-in_progress { background:#dbeafe; color:#1e40af; }
  .status-resolved { background:#dcfce7; color:#166534; }
</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

<header class="bg-slate-800 text-white px-6 py-4 flex items-center justify-between shadow">
  <div>
    <h1 class="text-xl font-bold">🏛️ CivicFix — Authority Dashboard</h1>
    <p class="text-slate-300 text-sm">Prioritize → Assign → Work → Resolve → Learn</p>
  </div>
  <a href="/" class="bg-white text-slate-800 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-slate-100">← Citizen View</a>
</header>

<main class="max-w-7xl mx-auto p-6 space-y-6">

  <!-- Analytics summary -->
  <section class="grid grid-cols-2 md:grid-cols-5 gap-4" id="statCards"></section>

  <div class="grid md:grid-cols-2 gap-6">
    <section class="bg-white rounded-xl shadow p-4">
      <h2 class="text-lg font-bold mb-3">🗺️ Issue Map</h2>
      <div id="map"></div>
    </section>
    <section class="bg-white rounded-xl shadow p-4">
      <h2 class="text-lg font-bold mb-3">📊 Issues by Category</h2>
      <canvas id="categoryChart" height="160"></canvas>
    </section>
  </div>

  <!-- Priority Queue -->
  <section class="bg-white rounded-xl shadow p-4">
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-lg font-bold">🔥 Priority Queue</h2>
      <div class="flex gap-2">
        <select id="filterStatus" class="border rounded-lg px-2 py-1 text-sm" onchange="loadIssues()">
          <option value="">All statuses</option>
          <option value="reported">Reported</option>
          <option value="acknowledged">Acknowledged</option>
          <option value="in_progress">In Progress</option>
          <option value="resolved">Resolved</option>
        </select>
      </div>
    </div>
    <div id="issueList" class="space-y-2"></div>
  </section>

  <!-- Recurring hotspots -->
  <section class="bg-white rounded-xl shadow p-4">
    <h2 class="text-lg font-bold mb-3">🔁 Recurring Hotspots (Learn)</h2>
    <div id="hotspots" class="text-sm text-slate-500">Loading...</div>
  </section>

</main>

<script>
const map = L.map('map').setView([12.9716, 77.5946], 12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);
let markers = [];
let categoryChart = null;

function statusLabel(s) {
  return { reported: 'Reported', acknowledged: 'Acknowledged', in_progress: 'In Progress', resolved: 'Resolved' }[s] || s;
}

async function loadAnalytics() {
  const res = await fetch('/api/analytics');
  const a = await res.json();

  const cards = [
    { label: 'Total Issues', value: a.total_issues },
    { label: 'Reported', value: a.by_status.reported || 0 },
    { label: 'In Progress', value: a.by_status.in_progress || 0 },
    { label: 'Resolved', value: a.by_status.resolved || 0 },
    { label: 'Avg Resolution (hrs)', value: a.avg_resolution_hours ?? '—' },
  ];
  document.getElementById('statCards').innerHTML = cards.map(c => `
    <div class="bg-white rounded-xl shadow p-4 text-center">
      <p class="text-2xl font-bold text-slate-800">${c.value}</p>
      <p class="text-xs text-slate-500">${c.label}</p>
    </div>
  `).join('');

  const labels = Object.keys(a.by_category);
  const values = Object.values(a.by_category);
  if (categoryChart) categoryChart.destroy();
  categoryChart = new Chart(document.getElementById('categoryChart'), {
    type: 'bar',
    data: { labels: labels.map(l => l.replace('_',' ')), datasets: [{ label: 'Issues', data: values, backgroundColor: '#0f766e' }] },
    options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
  });

  const hotspotsEl = document.getElementById('hotspots');
  if (a.recurring_hotspots.length === 0) {
    hotspotsEl.innerHTML = '<p class="text-slate-400">No recurring hotspots detected yet.</p>';
  } else {
    hotspotsEl.innerHTML = a.recurring_hotspots.map(h => `
      <div class="flex justify-between border-b py-2">
        <span>${h.category.replace('_',' ')} near (${h.lat.toFixed(3)}, ${h.lng.toFixed(3)})</span>
        <span class="font-semibold">${h.c} reports</span>
      </div>
    `).join('');
  }
}

async function loadIssues() {
  const statusFilter = document.getElementById('filterStatus').value;
  const url = statusFilter ? `/api/issues?status=${statusFilter}` : '/api/issues';
  const res = await fetch(url);
  const issues = await res.json();

  markers.forEach(m => map.removeLayer(m));
  markers = [];
  issues.forEach(issue => {
    const color = { reported: '#dc2626', acknowledged: '#d97706', in_progress: '#2563eb', resolved: '#16a34a' }[issue.status] || '#6b7280';
    const marker = L.circleMarker([issue.lat, issue.lng], { radius: 7, color, fillColor: color, fillOpacity: 0.7 }).addTo(map);
    marker.bindPopup(`<b>${issue.category.replace('_',' ')}</b><br>Priority: ${issue.priority_score}`);
    markers.push(marker);
  });

  const listEl = document.getElementById('issueList');
  if (issues.length === 0) {
    listEl.innerHTML = '<p class="text-slate-400">No issues found.</p>';
    return;
  }
  listEl.innerHTML = issues.map(i => `
    <div class="border rounded-lg p-3 flex flex-wrap items-center justify-between gap-2">
      <div class="flex-1 min-w-[200px]">
        <div class="flex items-center gap-2">
          <span class="font-bold">${i.category.replace('_',' ')}</span>
          <span class="text-xs px-2 py-0.5 rounded-full status-${i.status}">${statusLabel(i.status)}</span>
          ${i.reopened_count > 0 ? `<span class="text-xs px-2 py-0.5 rounded-full bg-red-100 text-red-700">Reopened ${i.reopened_count}x</span>` : ''}
        </div>
        <p class="text-sm text-slate-500">${i.description}</p>
        <p class="text-xs text-slate-400">📍 ${i.lat.toFixed(4)}, ${i.lng.toFixed(4)} • 🏢 ${i.department} • 👍 ${i.upvotes} confirmations • Priority score: <b>${i.priority_score}</b></p>
      </div>
      <div class="flex gap-1">
        <button onclick="setStatus('${i.id}','acknowledged')" class="bg-amber-500 text-white text-xs px-2 py-1 rounded">Acknowledge</button>
        <button onclick="setStatus('${i.id}','in_progress')" class="bg-blue-600 text-white text-xs px-2 py-1 rounded">In Progress</button>
        <button onclick="resolveIssue('${i.id}')" class="bg-emerald-600 text-white text-xs px-2 py-1 rounded">Resolve</button>
      </div>
    </div>
  `).join('');
}

async function setStatus(id, status) {
  await fetch(`/api/issues/${id}/status`, {
    method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status })
  });
  loadIssues(); loadAnalytics();
}
async function resolveIssue(id) {
  await fetch(`/api/issues/${id}/resolve`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({})
  });
  loadIssues(); loadAnalytics();
}

loadIssues(); loadAnalytics();
setInterval(() => { loadIssues(); loadAnalytics(); }, 8000);
</script>
</body>
</html>
